{% extends "base.html" %}
{% block title %}Recuperar Contraseña{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
  <div class="card shadow-lg p-4 col-md-5">
    <h3 class="text-center mb-4">🔑 Recuperar Contraseña</h3>

    <form method="POST">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="tuemail@ejemplo.com" required>
      </div>

      <button type="submit" class="btn btn-purple w-100">Enviar enlace</button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('login') }}" class="text-decoration-none">← Volver al inicio de sesión</a>
    </div>
  </div>
</div>
{% endblock %}
