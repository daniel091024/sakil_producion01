{% extends "base.html" %}
{% block title %}Restablecer Contraseña{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
  <div class="card shadow-lg p-4 col-md-5">
    <h3 class="text-center mb-4">🔐 Restablecer Contraseña</h3>

    <form method="POST">
      <div class="mb-3">
        <label for="password" class="form-label">Nueva contraseña</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-purple w-100">Guardar contraseña</button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('login') }}" class="text-decoration-none">← Volver al inicio de sesión</a>
    </div>
  </div>
</div>
{% endblock %}
